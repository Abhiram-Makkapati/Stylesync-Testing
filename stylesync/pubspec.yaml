name: stylesync
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # All Firebase packages are now updated to modern, compatible versions
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_app_check: ^0.4.1+2

  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  image_picker: ^1.2.1
  uuid: ^4.5.2
  http: ^1.6.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

  table_calendar: ^3.2.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  video_player: ^2.10.1
  dots_indicator: ^4.0.1
  showcaseview: ^5.0.1
  feature_discovery: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  ferry_generator: ^0.14.0-dev.2
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  mock_exceptions: ^0.8.2

flutter:
  uses-material-design: true

  # ---------------------------------------------------------
  # ONLY REQUIRED ADDITION (NOTHING ELSE CHANGED)
  assets:
    - assets/images/
  # ---------------------------------------------------------

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  #assets:
  #  - assets/
